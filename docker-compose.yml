version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    # No need to expose 5432 externally in production
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: nest_backend
    restart: always
    # No need to expose 3001 externally — nginx handles routing
    expose:
      - "3000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: next_frontend
    restart: always
    # No need to expose 3000 externally — nginx handles routing
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.production

  # nginx:
  #   image: nginx:stable
  #   container_name: nginx_proxy
  #   restart: always
  #   depends_on:
  #     - frontend
  #     - backend
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data: