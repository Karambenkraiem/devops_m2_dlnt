services:

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - db_prod:/var/lib/postgresql/data
    # Pas de port exposé publiquement — accessible uniquement en interne Docker

  backend:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    container_name: nest_backend
    restart: always
    expose:
      - "3000"    # Port interne uniquement — Nginx route vers backend:3000
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: next_frontend
    restart: always
    expose:
      - "3000"    # Port interne uniquement — Nginx route vers frontend:3000
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"   # Seul port exposé publiquement sur le VPS
    volumes:
      - ./nginx/default:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  db_prod: